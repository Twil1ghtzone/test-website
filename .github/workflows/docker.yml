name: Build & push Docker image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Qualitätstor ──
  # Läuft VOR dem Image-Build. Ohne diesen Job wurde bei jedem Push auf main
  # gebaut und nach ghcr.io gepusht, ohne dass je ein Test oder der
  # TypeScript-Compiler gelaufen wäre — fehlerhafter Code wäre über
  # `docker compose pull` sofort auf jedem Server gelandet.
  qualitaet:
    name: Typen & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` statt `npm install`: installiert exakt die Versionen aus
      # package-lock.json und schlägt fehl, wenn Lockfile und package.json
      # auseinanderlaufen — genau das, was eine CI prüfen soll.
      - name: Abhängigkeiten installieren
        run: npm ci

      - name: TypeScript prüfen
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

  build-and-push:
    name: Image bauen & pushen
    runs-on: ubuntu-latest
    # Kein Image ohne grüne Tests.
    needs: qualitaet
    # Pull Requests werden geprüft, aber nicht veröffentlicht — sonst würde
    # jeder PR das `latest`-Tag der Produktion überschreiben.
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/twil1ghtzone/test-website:latest
            ghcr.io/twil1ghtzone/test-website:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
